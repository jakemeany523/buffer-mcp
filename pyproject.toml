[project]
name = "buffer-mcp"
version = "2.0.0"
description = "MCP server for Buffer social media scheduling via GraphQL API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jake Meany" }]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/jakemeany523/buffer-mcp"
Repository = "https://github.com/jakemeany523/buffer-mcp"
Issues = "https://github.com/jakemeany523/buffer-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["server"]

[project.scripts]
buffer-mcp = "server:main"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
