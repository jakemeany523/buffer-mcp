[project]
name = "buffer-mcp"
version = "2.0.0"
description = "MCP server for Buffer social media scheduling via GraphQL API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jake Meany" }]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
buffer-mcp = "server:mcp.run"
